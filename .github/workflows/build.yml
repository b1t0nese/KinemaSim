name: Build KinemaSim

# Сборка onefile-банджей: macOS (.app) и Windows (.exe) — PyInstaller не умеет
# кросс-компиляцию, поэтому каждая платформа собирается на своём раннере.
# При пуше тега v* оба билда публикуются в GitHub Release.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run engine self-tests
        run: python tests/test_engine.py

      - name: Build onefile app
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name KinemaSim \
            --add-data "src/interface_module/uis:interface_module/uis" \
            --add-data "src/resources:resources" \
            src/main.py
          zip -r KinemaSim-macOS.zip dist/KinemaSim.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KinemaSim-macOS
          path: KinemaSim-macOS.zip

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: KinemaSim-macOS.zip
          generate_release_notes: true

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run engine self-tests
        run: python tests/test_engine.py

      - name: Build onefile exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name KinemaSim `
            --add-data "src/interface_module/uis;interface_module/uis" `
            --add-data "src/resources;resources" `
            src/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KinemaSim-windows
          path: dist/KinemaSim.exe

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KinemaSim.exe
          generate_release_notes: true
